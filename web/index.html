<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smartibot Drive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card off" id="card">
    <h1>Smartibot</h1>
    <div class="link" aria-hidden="true">
      <svg class="node" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1"/><path d="M2 19h20"/></svg>
      <span class="wire"></span>
      <svg class="node" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 8V5"/><circle cx="9.5" cy="13" r="1"/><circle cx="14.5" cy="13" r="1"/></svg>
    </div>
    <p class="status" id="status" role="status">Not connected</p>
    <button id="connect">Connect</button>
    <div class="pad">
      <button data-direction="forward" aria-label="Forward">▲</button>
      <button data-direction="left" aria-label="Left">◀</button>
      <button data-direction="right" aria-label="Right">▶</button>
      <button data-direction="back" aria-label="Back">▼</button>
    </div>
    <p class="hint">Hold an arrow key or button to drive</p>
  </main>

  <!-- Order matters: each file uses things defined by the ones above it -->
  <script src="https://www.espruino.com/js/uart.js"></script>
  <script src="connection.js"></script>
  <script src="robot.js"></script>
  <script src="controls.js"></script>
</body>
</html>
