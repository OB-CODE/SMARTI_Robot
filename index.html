<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smartibot Drive</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #6b7280;
      --btn: #e6e9ef;
      --btn-edge: #c9ced8;
      --accent: #2f9e6f;
      --accent-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --card: #1d2129;
        --text: #e8eaee;
        --muted: #9aa1ad;
        --btn: #2a303a;
        --btn-edge: #3a414d;
        --accent: #3cc488;
        --accent-text: #0d1a14;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    /* Connection display: browser ── link ── robot */
    .link { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 12px 0 6px; }
    .node { color: var(--muted); opacity: 0.6; transition: opacity 300ms; }
    .wire {
      flex: 0 1 60px; height: 2px;
      background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 8px);
      opacity: 0.3;
      transition: opacity 300ms;
    }
    .connecting .wire { animation: blink 1.2s infinite; }
    .on .node { color: var(--text); opacity: 1; }
    .on .wire {
      opacity: 0.8;
      background: repeating-linear-gradient(90deg, var(--accent) 0 4px, transparent 4px 8px);
      background-size: 8px 2px;
      animation: flow 1.5s linear infinite;
    }
    @keyframes flow { to { background-position: 8px 0; } }
    @keyframes blink { 50% { opacity: 0.1; } }
    .status { margin: 0 0 20px; color: var(--muted); font-size: 0.85rem; }
    .pad { transition: opacity 200ms; }
    .off .pad { opacity: 0.4; pointer-events: none; }
    #connect {
      width: 100%;
      padding: 12px;
      margin-bottom: 24px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 8px;
      justify-content: center;
    }
    .pad button {
      border: 0;
      border-radius: 16px;
      background: var(--btn);
      box-shadow: 0 5px 0 var(--btn-edge);
      color: var(--text);
      font-size: 2rem;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 60ms, box-shadow 60ms, background 60ms;
    }
    .pad button.active {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 1px 0 var(--btn-edge);
      transform: translateY(4px);
    }
    [data-key="ArrowUp"]    { grid-area: 1 / 2; }
    [data-key="ArrowLeft"]  { grid-area: 2 / 1; }
    [data-key="ArrowRight"] { grid-area: 2 / 3; }
    [data-key="ArrowDown"]  { grid-area: 3 / 2; }
    .hint { margin: 20px 0 0; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main class="card off" id="card">
    <h1>Smartibot</h1>
    <div class="link" aria-hidden="true">
      <svg class="node" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1"/><path d="M2 19h20"/></svg>
      <span class="wire"></span>
      <svg class="node" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 8V5"/><circle cx="9.5" cy="13" r="1"/><circle cx="14.5" cy="13" r="1"/></svg>
    </div>
    <p class="status" id="status" role="status">Not connected</p>
    <button id="connect">Connect</button>
    <div class="pad">
      <button data-key="ArrowUp" aria-label="Forward">▲</button>
      <button data-key="ArrowLeft" aria-label="Left">◀</button>
      <button data-key="ArrowRight" aria-label="Right">▶</button>
      <button data-key="ArrowDown" aria-label="Back">▼</button>
    </div>
    <p class="hint">Hold an arrow key or button to drive</p>
  </main>

  <script src="https://www.espruino.com/js/uart.js"></script>
  <script>
    // Sent to the robot once: drive() only touches the motors when the speed changes (repeats just keep them running),
    // and stops them unless another drive() arrives within 500ms
    const setup = "\x10var _t,_l=0,_r=0;function drive(l,r){if(l!=_l||r!=_r){motor(l,r);_l=l;_r=r;}if(_t)clearTimeout(_t);_t=setTimeout(function(){_t=0;_l=_r=0;motor(0,0);},500);}\n";
    const keys = {
      ArrowUp:    [1, 1],
      ArrowDown:  [-1, -1],
      ArrowLeft:  [-1, 1],
      ArrowRight: [1, -1],
    };
    const buttons = {};
    document.querySelectorAll(".pad button").forEach(b => buttons[b.dataset.key] = b);
    const status = document.getElementById("status");
    const card = document.getElementById("card");
    const connectBtn = document.getElementById("connect");
    let held = null, pressedAt = 0, stopPending = false, sending = false;

    // Turns start gently and speed up the longer the key is held, so a quick tap only nudges the robot round
    const TURN_START = 0.4; // turn speed on first press (0-1); lower = smaller minimum turn
    const TURN_RAMP_MS = 600; // time to reach full turn speed
    const speedFor = key => {
      const [l, r] = keys[key];
      if (l === r) return [l, r]; // forward/back: full speed straight away
      const t = Math.min(1, (Date.now() - pressedAt) / TURN_RAMP_MS);
      const s = TURN_START + (1 - TURN_START) * t;
      return [+(l * s).toFixed(2), +(r * s).toFixed(2)];
    };

    // Only one command is ever in flight, so commands can't pile up in the Bluetooth queue.
    // While a key is held, the next drive() goes out as soon as the previous one has been delivered.
    const pump = async () => {
      if (sending || !UART.isConnected()) return;
      sending = true;
      try {
        while (held || stopPending) {
          const [l, r] = held ? speedFor(held) : [0, 0];
          if (!held) stopPending = false;
          // noWait: resolve once delivered, instead of waiting ~0.3s for a reply the robot never sends
          await UART.write(`\x10drive(${l},${r});\n`, { noWait: true });
          if (held) await new Promise(res => setTimeout(res, 100));
        }
      } catch (e) {
        // connection dropped; the robot's timeout stops the motors
      } finally {
        sending = false;
      }
    };

    const press = key => {
      if (held) buttons[held].classList.remove("active");
      held = key;
      pressedAt = Date.now();
      buttons[key].classList.add("active");
      pump();
    };
    const release = key => {
      if (!held || (key && key !== held)) return;
      buttons[held].classList.remove("active");
      held = null;
      stopPending = true; // stop right away; the robot's timeout is only a backup
      pump();
    };

    // state: "off" | "connecting" | "on"
    let since = 0, clock = null;
    const setState = state => {
      card.className = "card " + state;
      clearInterval(clock);
      if (state === "off") {
        release();
        status.textContent = "Not connected";
        connectBtn.textContent = "Connect";
      } else if (state === "connecting") {
        status.textContent = "Connecting…";
      } else {
        since = Date.now();
        const tick = () => {
          const s = Math.floor((Date.now() - since) / 1000);
          status.textContent = `Connected · ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        };
        tick();
        clock = setInterval(tick, 1000);
        connectBtn.textContent = "Disconnect";
      }
    };

    connectBtn.onclick = () => {
      if (UART.isConnected()) return UART.close(); // 'close' handler resets the display
      setState("connecting");
      UART.write(setup)
        .then(() => {
          const c = UART.getConnection();
          if (!c) return setState("off");
          c.on("close", () => setState("off"));
          setState("on");
        })
        .catch(() => setState("off")); // e.g. device picker cancelled
    };

    document.onkeydown = e => {
      if (!keys[e.key]) return;
      e.preventDefault();
      if (!e.repeat) press(e.key);
    };
    document.onkeyup = e => release(e.key);
    window.onblur = () => release();

    Object.entries(buttons).forEach(([key, b]) => {
      b.onpointerdown = e => { e.preventDefault(); press(key); };
      b.onpointerup = b.onpointerleave = b.onpointercancel = () => release(key);
      b.oncontextmenu = e => e.preventDefault();
    });
  </script>
</body>
</html>
