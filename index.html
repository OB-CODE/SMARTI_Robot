<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smartibot Drive</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #6b7280;
      --btn: #e6e9ef;
      --btn-edge: #c9ced8;
      --accent: #2f9e6f;
      --accent-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --card: #1d2129;
        --text: #e8eaee;
        --muted: #9aa1ad;
        --btn: #2a303a;
        --btn-edge: #3a414d;
        --accent: #3cc488;
        --accent-text: #0d1a14;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    /* Connection display: browser ── link ── robot */
    .link { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 16px 0 8px; }
    .node {
      width: 52px; height: 52px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--btn);
      font-size: 1.5rem;
      transition: background 200ms, box-shadow 200ms;
    }
    .wire {
      flex: 0 1 100px; height: 4px;
      border-radius: 2px;
      background: repeating-linear-gradient(90deg, var(--muted) 0 8px, transparent 8px 14px);
      opacity: 0.4;
    }
    .connecting .wire { opacity: 1; animation: blink 0.8s infinite; }
    .on .wire {
      opacity: 1;
      background: repeating-linear-gradient(90deg, var(--accent) 0 8px, transparent 8px 14px);
      background-size: 14px 4px;
      animation: flow 0.6s linear infinite;
    }
    .on .node { background: var(--accent); animation: pulse 1.6s infinite; }
    @keyframes flow { to { background-position: 14px 0; } }
    @keyframes blink { 50% { opacity: 0.2; } }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
      100% { box-shadow: 0 0 0 12px transparent; }
    }
    .status { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
    .on .status { color: var(--accent); font-weight: 600; }
    .pad { transition: opacity 200ms; }
    .off .pad { opacity: 0.4; pointer-events: none; }
    #connect {
      width: 100%;
      padding: 12px;
      margin-bottom: 24px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 8px;
      justify-content: center;
    }
    .pad button {
      border: 0;
      border-radius: 16px;
      background: var(--btn);
      box-shadow: 0 5px 0 var(--btn-edge);
      color: var(--text);
      font-size: 2rem;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 60ms, box-shadow 60ms, background 60ms;
    }
    .pad button.active {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 1px 0 var(--btn-edge);
      transform: translateY(4px);
    }
    [data-key="ArrowUp"]    { grid-area: 1 / 2; }
    [data-key="ArrowLeft"]  { grid-area: 2 / 1; }
    [data-key="ArrowRight"] { grid-area: 2 / 3; }
    [data-key="ArrowDown"]  { grid-area: 3 / 2; }
    .hint { margin: 20px 0 0; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main class="card off" id="card">
    <h1>Smartibot</h1>
    <div class="link" aria-hidden="true">
      <span class="node">💻</span>
      <span class="wire"></span>
      <span class="node">🤖</span>
    </div>
    <p class="status" id="status" role="status">Not connected</p>
    <button id="connect">Connect</button>
    <div class="pad">
      <button data-key="ArrowUp" aria-label="Forward">▲</button>
      <button data-key="ArrowLeft" aria-label="Left">◀</button>
      <button data-key="ArrowRight" aria-label="Right">▶</button>
      <button data-key="ArrowDown" aria-label="Back">▼</button>
    </div>
    <p class="hint">Hold an arrow key or button to drive</p>
  </main>

  <script src="https://www.espruino.com/js/uart.js"></script>
  <script>
    // Sent to the robot once: drive() runs the motors, then stops them unless another drive() arrives within 300ms
    const setup = "\x10var _t;function drive(l,r){motor(l,r);if(_t)clearTimeout(_t);_t=setTimeout(function(){_t=0;motor(0,0);},300);}\n";
    const keys = {
      ArrowUp:    [1, 1],
      ArrowDown:  [-1, -1],
      ArrowLeft:  [-1, 1],
      ArrowRight: [1, -1],
    };
    const buttons = {};
    document.querySelectorAll(".pad button").forEach(b => buttons[b.dataset.key] = b);
    const status = document.getElementById("status");
    const card = document.getElementById("card");
    const connectBtn = document.getElementById("connect");
    let held = null, timer = null;

    const send = ([l, r]) => UART.write(`\x10drive(${l},${r});\n`);

    const press = key => {
      if (held) buttons[held].classList.remove("active");
      held = key;
      buttons[key].classList.add("active");
      send(keys[key]);
      clearInterval(timer);
      timer = setInterval(() => send(keys[held]), 100); // keep the robot moving
    };
    const release = key => {
      if (!held || (key && key !== held)) return;
      buttons[held].classList.remove("active");
      held = null;
      clearInterval(timer); // stop resending; the robot's 300ms timeout stops the motors
    };

    // state: "off" | "connecting" | "on"
    let since = 0, clock = null;
    const setState = state => {
      card.className = "card " + state;
      clearInterval(clock);
      if (state === "off") {
        release();
        status.textContent = "Not connected";
        connectBtn.textContent = "Connect";
      } else if (state === "connecting") {
        status.textContent = "Connecting…";
      } else {
        since = Date.now();
        const tick = () => {
          const s = Math.floor((Date.now() - since) / 1000);
          status.textContent = `Connected · ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        };
        tick();
        clock = setInterval(tick, 1000);
        connectBtn.textContent = "Disconnect";
      }
    };

    connectBtn.onclick = () => {
      if (UART.isConnected()) return UART.close(); // 'close' handler resets the display
      setState("connecting");
      UART.write(setup)
        .then(() => {
          const c = UART.getConnection();
          if (!c) return setState("off");
          c.on("close", () => setState("off"));
          setState("on");
        })
        .catch(() => setState("off")); // e.g. device picker cancelled
    };

    document.onkeydown = e => {
      if (!keys[e.key]) return;
      e.preventDefault();
      if (!e.repeat) press(e.key);
    };
    document.onkeyup = e => release(e.key);
    window.onblur = () => release();

    Object.entries(buttons).forEach(([key, b]) => {
      b.onpointerdown = e => { e.preventDefault(); press(key); };
      b.onpointerup = b.onpointerleave = b.onpointercancel = () => release(key);
      b.oncontextmenu = e => e.preventDefault();
    });
  </script>
</body>
</html>
